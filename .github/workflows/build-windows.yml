name: Build GRIT-12 VST3

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Configure CMake
        run: cmake -S . -B build -A x64

      - name: Build VST3 and Standalone
        run: cmake --build build --config Release --parallel

      - name: Upload compiled plugin
        uses: actions/upload-artifact@v6
        with:
          name: GRIT-12-Windows-VST3
          path: |
            build/GRIT12_artefacts/Release/VST3/GRIT-12.vst3
            build/GRIT12_artefacts/Release/Standalone/GRIT-12.exe
          if-no-files-found: error
          compression-level: 6
